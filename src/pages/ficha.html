<!--
  Ficha de producto · /arq/producto/{slug} · template de la colección «Productos» del CMS + Code Embed
  (docs/decisiones.md, 2026-10-01 · Páginas en Webflow y 2026-10-02 · Ficha de producto por grupo; 2026-10-07 · Base de datos sin IDs)
  Pantalla: Final › Ficha (1218:10487 Desktop · 1220:11334 Mobile · 1218:11777 / 1220:12601 Iluminar)
  Se edita acá y se pega en Webflow. dist/arq.js, dist/arq.css y Albert Sans se cargan a nivel sitio.

  Campos del CMS (un ítem por grupo, solo nombre y slug): en Webflow, cada valor de ejemplo se reemplaza por su campo dinámico:
    data-group  → slug (el id del grupo: product_name en minúsculas con guiones, kanu-jardin)
    <h1>        → nombre (product_name)
  El resto sale de Typesense, textos incluidos: descripción corta, story, inspiración, variantes,
  galería, especificaciones, descargas, glosario y otras familias.
  La variante elegida va en ?sku=; el canonical es la URL sin parámetro (Webflow).
-->
