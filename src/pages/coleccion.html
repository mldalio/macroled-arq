<!--
  Colección · /arq/coleccion/{slug} · template de la colección «Colecciones» del CMS + Code Embed
  (docs/decisiones.md, 2026-10-01 · Páginas en Webflow y 2026-10-05 · Colección; 2026-10-07 · Base de datos sin IDs)
  Pantalla: Final › Colección (1234:13201 Desktop · 1234:13448 Mobile)
  Se edita acá y se pega en Webflow. dist/arq.js, dist/arq.css y Albert Sans se cargan a nivel sitio.

  Campos del CMS (un ítem por colección, solo nombre y slug): en Webflow, cada valor de ejemplo se reemplaza por su campo dinámico:
    data-collection          → slug (el id de la colección: su product_name en minúsculas con guiones, kanu)
    breadcrumb actual y <h1> → nombre
  El resto sale de Typesense: la intro (en el page-header), la descripción, las cards (una por grupo) y las fotos.
-->
<arq-navbar>
  <!-- La colección es parte de Productos: Productos va como Current (sin flecha; se deja has-dropdown) -->
  <arq-nav-link slot="links" has-dropdown current>Productos</arq-nav-link>
  <arq-nav-link slot="links" href="/arq/descargas">Descargas</arq-nav-link>
  <arq-nav-link slot="links" href="/arq/contacto">Contacto</arq-nav-link>
</arq-navbar>

<main>
  <arq-page-header show-breadcrumb show-description>
    <arq-breadcrumb slot="breadcrumb">
      <arq-breadcrumb-item href="/arq/productos?view=colecciones" show-separator>Colecciones</arq-breadcrumb-item>
      <arq-breadcrumb-item current>Kanu</arq-breadcrumb-item>
    </arq-breadcrumb>
    <h1 slot="title">Colección Kanu</h1>
  </arq-page-header>

  <arq-coleccion data-collection="kanu"></arq-coleccion>
</main>

<arq-footer>
  <span slot="tagline">Diseño lumínico para la arquitectura contemporánea.</span>
  <h2 slot="productos-title">Productos</h2>
  <arq-footer-link slot="productos" href="/arq/productos?environment=Interior">Interior</arq-footer-link>
  <arq-footer-link slot="productos" href="/arq/productos?environment=Exterior">Exterior</arq-footer-link>
  <arq-footer-link slot="productos" href="/arq/productos?product_type=L%C3%A1mpara">Lámparas y Artefactos</arq-footer-link>
  <arq-footer-link slot="productos" href="/arq/productos?view=colecciones">Colecciones</arq-footer-link>
  <h2 slot="informacion-title">Información</h2>
  <arq-footer-link slot="informacion" href="/arq/contacto">Contacto</arq-footer-link>
  <arq-footer-link slot="informacion" href="/arq/descargas">Descargas</arq-footer-link>
  <h2 slot="redes-title">Redes</h2>
  <arq-footer-link slot="redes" href="https://www.instagram.com/" target="_blank" show-icon icon="instagram" label="Macroled Arq en Instagram">Instagram</arq-footer-link>
  <arq-footer-link slot="redes" href="https://www.youtube.com/" target="_blank" show-icon icon="youtube" label="Macroled Arq en YouTube">YouTube</arq-footer-link>
</arq-footer>
